<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R.R. Jewellers &mdash; App Info</title>
<meta name="description" content="R.R. Jewellers iOS app &mdash; support and privacy policy.">
<style>
  :root{ --gold:#b8860b; --gold-soft:#c9a227; --ink:#1c1a15; --muted:#6b6659; --bg:#faf7f0; --card:#ffffff; --line:#ece5d5; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.6;font-size:17px}
  .wrap{max-width:640px;margin:0 auto;padding:56px 20px;text-align:center}
  .coin{width:56px;height:56px;border-radius:50%;margin:0 auto 18px;
    background:radial-gradient(circle at 35% 30%,#f5d76e,var(--gold-soft) 70%,#9c7b12);
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 2px 6px rgba(0,0,0,.18)}
  h1{font-size:26px;margin:0 0 6px}
  p.sub{color:var(--muted);margin:0 0 30px}
  .links{display:grid;gap:12px;max-width:360px;margin:0 auto}
  a.btn{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;text-decoration:none;color:inherit;font-weight:600}
  a.btn span{display:block;font-weight:400;color:var(--muted);font-size:14px;margin-top:2px}
  footer{margin-top:34px;color:var(--muted);font-size:13px}
  @media (prefers-color-scheme: dark){
    :root{ --ink:#efe9db; --muted:#a9a08c; --bg:#141310; --card:#1e1c17; --line:#2e2a20; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="coin"></div>
  <h1>R.R. Jewellers</h1>
  <p class="sub">Live gold &amp; silver rates &middot; Serving Etawah since 1982</p>
  <div class="links">
    <a class="btn" href="./support/">Help &amp; Support<span>Contact us &middot; FAQs</span></a>
    <a class="btn" href="./privacy/">Privacy Policy<span>How the app handles your data</span></a>
  </div>
  <footer>&copy; 2026 R.R. Jewellers &middot; Developed by RR Tech Solutions</footer>
</div>
</body>
</html>
